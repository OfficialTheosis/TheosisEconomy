################################################
#                                              #
#                   SETTINGS                   #
#                                              #
################################################
settings:

  # Settings related to your currency
  currency:

    # The balance a new player will start with, and what "/economy reset <player>" will set the target player's balance to
    #      - TheosisEconomy does not support negative balances
    # Default: 0.00
    default-balance: 0.00

    # The maximum balance a player can have
    #      - Due to limitations of the Java "double" variable type, which Vault uses, this is limited depending on the number of decimal places you allow for your currency
    #      - The default value is 10 trillion, assuming you want to use 2 decimal places
    #      - If you want to use more than 2 decimal places, move the decimal point to the LEFT (e.g. for 4 decimal places, the max-balance value would become 100000000000.0000, which is 100 billion)
    #      - If you want to use less than 2 decimal places, move the decimal point to the RIGHT (e.g. for a whole number, you can just set the max-balance value to 1000000000000000, which is 1 quadrillion)
    #      - If you set the max-balance value to more than what the rules above allow, you will most likely experience precision loss, so I would strongly recommend not doing that
    # Default: 10000000000000.00
    max-balance: 10000000000000.00

    # The number of decimal places you want your currency to use
    #      - A server restart is required for changes to this value to take effect
    #      - Reducing this will permanently truncate the precision of all existing balances in the database that use more decimal places than what you reduce it to
    # Default: 2
    decimal-places: 2

    # Your currency name (singular)
    name-singular: "pound"

    # Your currency name (plural)
    name-plural: "pounds"

    # The format in which your currency will be displayed
    #      - <amount> will be replaced with the amount of money with comma-separation
    #      - <name> will be replaced with your currency name
    format: "£<amount> <name>"

    # What type of rounding should occur when an amount of money uses more decimal places than what the currency is configured to use
    #      - Valid values are NONE, ROUND_NEAREST, ROUND_UP, and ROUND_DOWN
    #      - If set to NONE, no rounding will occur, and the operation will be rejected
    # Default: NONE
    rounding-mode: NONE

  # Settings related to the "/balancetop" command
  balancetop:

    # The number of entries displayed per page
    # Default: 10
    entries-per-page: 10

    # The minimum balance a player must have to be shown
    # Default: 0.01
    min-balance: 0.01

    # Whether to exclude players with the permission `theosiseconomy.balancetop.exclude` from the list
    # Default: false
    consider-exclude-permission: false

    # Whether to exclude players who are permanently banned from your server from the list
    #      - Currently supports: vanilla bans, LiteBans
    # Default: false
    exclude-permanently-banned-players: false

    # The header format
    #      - <page> will be replaced with the current page
    header-format: "<gray>----------(<green>Top Balances (Page: <gold><page></gold>)</green>)----------</gray>"

    # What each entry will look like
    #      - <position> will be replaced with the player's leaderboard position
    #      - <player> will be replaced with the player's username
    #      - <dots> will be replaced with the number of dots required to align the content of the entry after the placeholder with that of other entries
    #      - <balance> will be replaced with the player's balance
    entry-format: "<dark_aqua><position>.</dark_aqua> <gold><player></gold> <dark_gray><dots></dark_gray> <gold><balance></gold>"

    # What the entry representing the command sender will look like
    #      - <position> will be replaced with the player's leaderboard position
    #      - <player> will be replaced with the player's username
    #      - <dots> will be replaced with the number of dots required to align the content of the entry after the placeholder with that of other entries
    #      - <balance> will be replaced with the player's balance
    entry-format-sender: "<aqua><position>.</aqua> <yellow><player></yellow> <gray><dots></gray> <yellow><balance></yellow>"

    # The width that the end of the <dots> placeholder should be aligned to
    #      - Player width is measured in Minecraft font pixels
    #      - Console width is measured in number of characters
    entry-dot-alignment-width:

      # Default: 130
      players: 130

      # Default: 40
      console: 40

    # The maximum number of "/balancetop" requests that can be in progress simultaneously
    #      - A server restart is required for changes to this value to take effect
    # Default: 10
    max-simultaneous-requests: 10

  # Settings related to commands
  #      - A server restart is required for changes to these to take effect
  commands:

    # The "/balance" command
    balance:

      # The command name - this is what players will need to type after "/" to execute this command
      name: "balance"

      # The description of the command
      description: "Check your own or another player's balance."

      # Alternative names players can use to execute this command
      aliases:
        - "bal"
        - "money"

    # The "/balancetop" command
    balancetop:
      name: "balancetop"
      description: "Display the balances of players from richest to poorest."
      aliases:
        - "baltop"

    # The "/pay" command
    pay:
      name: "pay"
      description: "Pay another player a specified amount of money."
      aliases: []

    # The "/paytoggle" command
    paytoggle:
      name: "paytoggle"
      description: "Toggle whether you want to be able to receive money from other players with /pay."
      aliases: []

    # The "/economy" command
    economy:
      name: "economy"
      description: "Manage the economy."
      aliases:
        - "eco"

  # Settings related to PlaceholderAPI placeholders
  placeholders:

    # How many BalanceTop entries should be held in memory, allowing them to be retrieved with placeholders
    #      - For example, if you want the placeholder %theosiseconomy_richest_7_name% to work, you must cache at least 7 entries
    balancetop-cache:

      # Default: 10
      entries: 10

      # Default: 30
      refresh-interval-seconds: 30

    # What the %theosiseconomy_richest_<position>_name% placeholder will be replaced with if there is no player in the specified position on "/balancetop"
    balancetop-position-name-none: "N/A"

    # What the %theosiseconomy_richest_<position>_uuid% placeholder will be replaced with if there is no player in the specified position on "/balancetop"
    balancetop-position-uuid-none: "N/A"

    # What the %theosiseconomy_richest_<position>_balance% placeholder will be replaced with if there is no player in the specified position on "/balancetop"
    balancetop-position-balance-none: "N/A"

    # What the %theosiseconomy_richest_<position>_balance_formatted% placeholder will be replaced with if there is no player in the specified position on "/balancetop"
    balancetop-position-balance_formatted-none: "N/A"

    # What the %theosiseconomy_richest_<position>_entry% placeholder will be replaced with if there is no player in the specified position on "/balancetop"
    balancetop-position-entry-none: ""

    # What the %theosiseconomy_richest_<position>_entry_legacy% placeholder will be replaced with if there is no player in the specified position on "/balancetop"
    balancetop-position-entry-legacy-none: ""

  # Settings related to the logging of monetary activity
  activity-logging:

    # Whether logs should be sent to the console
    # Default: true
    log-console: true

    # Whether logs should be saved to a file named "logs.log"
    # Default: true
    log-file: true

    # When TheosisEconomy creates an account for a player (this happens when they join the server, and don't already have an account)
    account-create:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      message: "Created account for <player> (<uuid>)."

    # When "/pay <player> <amount>" is used to pay another player
    pay:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <sender> will be replaced with the sender's username
      #       - <sender_uuid> will be replaced with the sender's UUID
      #       - <target> will be replaced with the target's username
      #       - <target_uuid> will be replaced with the target's UUID
      #       - <amount> will be replaced with the amount paid
      #       - <sender_balance> will be replaced with the sender's resulting balance
      #       - <target_balance> will be replaced with the target's resulting balance
      message: "<sender> (<sender_uuid>) paid <amount> to <target> (<target_uuid>). <sender>'s balance is now <sender_balance>, and <target>'s balance is now <target_balance>."

    # When "/economy set <player> <amount>" is used to set a player's balance
    economy-set:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <balance> will be replaced with the player's resulting balance
      message: "Set <player>'s (<uuid>) balance to <balance>."

    # When "/economy give <player> <amount>" is used to add money to a player's balance
    economy-give:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <amount> will be replaced with the amount given
      #       - <balance> will be replaced with the player's resulting balance
      message: "Gave <amount> to <player> (<uuid>). They now have <balance>."

    # When "/economy take <player> <amount>" is used to subtract money from a player's balance
    economy-take:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <amount> will be replaced with the amount taken
      #       - <balance> will be replaced with the player's resulting balance
      message: "Took <amount> from <player> (<uuid>). They now have <balance>."

    # When "/economy reset <player>" is used to reset a player's balance to default
    economy-reset:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <balance> will be replaced with the configured default balance
      message: "Reset <player>'s (<uuid>) balance to the default balance (<balance>)."

    # When a plugin tells TheosisEconomy to withdraw money from a player's balance via Vault, and the operation is successful
    vault-withdraw-success:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <amount> will be replaced with the amount withdrawn
      #       - <balance> will be replaced with the player's resulting balance
      message: "(Vault) Withdrew <amount> from <player>'s (<uuid>) balance. They now have <balance>."

    # When a plugin tells TheosisEconomy to withdraw money from a player's balance via Vault, but the operation fails
    vault-withdraw-fail:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <amount> will be replaced with the amount attempted to be withdrawn
      #       - <error_message> will be replaced with the error message
      message: "(Vault) Failed to withdraw <amount> from <player>'s (<uuid>) balance. Error message: <error_message>"

    # When a plugin tells TheosisEconomy to deposit money to a player's balance via Vault, and the operation is successful
    vault-deposit-success:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <amount> will be replaced with the amount deposited
      #       - <balance> will be replaced with the player's resulting balance
      message: "(Vault) Deposited <amount> to <player>'s (<uuid>) balance. They now have <balance>."

    # When a plugin tells TheosisEconomy to deposit money to a player's balance via Vault, but the operation fails
    vault-deposit-fail:

      # Whether to log this
      # Default: true
      log: true

      # The log message
      #       - <player> will be replaced with the player's username
      #       - <uuid> will be replaced with the player's UUID
      #       - <amount> will be replaced with the amount attempted to be deposited
      #       - <error_message> will be replaced with the error message
      message: "(Vault) Failed to deposit <amount> to <player>'s (<uuid>) balance. Error message: <error_message>"

  # Miscellaneous settings
  misc:

    # The maximum number of player names that should be cached for offline tab completion - the most recently-seen players are cached
    # Default: 4000
    most-recent-player-names-cache-max-size: 4000

################################################
#                                              #
#                   MESSAGES                   # All messages here use the MiniMessage format - https://docs.advntr.dev/minimessage/format.html
#                                              #
################################################
messages:

  # Messages related to the "/economy" command
  economy:

    # Messages related to the "set" sub-command
    set:

      # What the command sender receives upon setting the balance of a player
      #      - <target> will be replaced with the name of the target player
      #      - <amount> will be replaced with the amount the target's balance was set to
      balance-set-sender: "<dark_aqua>Set the balance of <gold><target></gold> to <gold><amount></gold>.</dark_aqua>"

      # What the target receives upon their balance being set
      #      - <amount> will be replaced with the amount the target's balance was set to
      balance-set-target: "<dark_aqua>Your balance has been set to <gold><amount></gold>.</dark_aqua>"

    # Messages related to the "give" sub-command
    give:

      # What the command sender receives upon giving money to a player
      #      - <target> will be replaced with the name of the target player
      #      - <amount> will be replaced with the amount given
      #      - <balance> will be replaced with the target's resulting balance
      money-given-sender: "<dark_aqua>Gave <gold><amount></gold> to <gold><target></gold>. They now have <gold><balance></gold>.</dark_aqua>"

      # What the target receives upon having money given to them
      #      - <amount> will be replaced with the amount given
      #      - <balance> will be replaced with the target's resulting balance
      money-given-target: "<dark_aqua><gold><amount></gold> has been added to your balance. You now have <gold><balance></gold>.</dark_aqua>"

    # Messages related to the "take" sub-command
    take:

      # What the command sender receives upon taking money from a player
      #      - <target> will be replaced with the name of the target player
      #      - <amount> will be replaced with the amount taken
      #      - <balance> will be replaced with the target's resulting balance
      money-taken-sender: "<dark_aqua>Took <gold><amount></gold> from <gold><target></gold>. They now have <gold><balance></gold></dark_aqua>"

      # What the target receives upon having money taken from them
      #      - <amount> will be replaced with the amount taken
      #      - <balance> will be replaced with the target's resulting balance
      money-taken-target: "<dark_aqua><gold><amount></gold> has been taken from your balance You now have <gold><balance></gold>.</dark_aqua>"

      # When the command sender tries to take money from a player, but it would result in the target player's balance being less than 0
      #      - <target> will be replaced with the name of the target player
      #      - <amount> will be replaced with the specified amount
      insufficient-funds: "<red><gold><target></gold> does not have enough money to afford losing <gold><amount></gold>.</red>"

    # Messages related to the "reset" sub-command
    reset:

      # What the sender receives upon resetting the balance of a player
      #      - <target> will be replaced with the name of the target player
      #      - <balance> will be replaced with the configured default balance
      balance-reset-sender: "<dark_aqua>Reset the balance of <gold><target></gold> to default (<gold><balance></gold>).</dark_aqua>"

      # What the target receives upon their balance being reset
      #       - <balance> will be replaced with the configured default balance
      balance-reset-target: "<dark_aqua>Your balance has been reset to default (<gold><balance></gold>).</dark_aqua>"

      # When a player's balance is attempted to be reset, but it would result in their balance being negative
      #      - <target> will be replaced with the name of the target player
      negative-default-balance: "<red>The default balance is currently configured to be negative. This means that resetting <gold><target></gold>'s balance would result in their balance being negative, and TheosisEconomy does not support negative balances.</red>"

      # When a player's balance is attempted to be reset, but it would result in the number of decimal places in their balance being higher than what the currency is configured to use
      #      - <target> will be replaced with the name of the target player
      too-many-decimal-places-default-balance: "<red>The default balance is currently configured to use more decimal places than what the currency is currently configured to use. This means that resetting <gold><target></gold>'s balance would result in their new balance having more decimal places than what the currency is configured to use.</red>"

      # When a player's balance is attempted to be reset, but it would result in setting their balance being higher than the maximum balance
      #      - <target> will be replaced with the name of the target player
      default-balance-exceeds-max-balance: "<red>The default balance is currently configured to be greater than the maximum balance. This means that resetting <gold><target></gold>'s balance would result in their new balance exceeding the maximum balance.</red>"

    # When the command sender reloads the plugin using "/economy reload"
    reload: "<dark_aqua>Reload successful.</dark_aqua>"

    # When no or an incorrect sub-command is used
    help: |-
      <gray>----------(<green>Economy Management</green>)----------</gray>
      <gray>-</gray> <click:suggest_command:/economy set ><hover:show_text:'<aqua>Click</aqua>'><gold>/economy set <player> <amount></gold></hover></click> <gray>-</gray> <dark_aqua>Set the specified player's balance to the specified amount</dark_aqua>
      <gray>-</gray> <click:suggest_command:/economy give ><hover:show_text:'<aqua>Click</aqua>'><gold>/economy give <player> <amount></gold></hover></click> <gray>-</gray> <dark_aqua>Add the specified amount of money to the specified player's balance</dark_aqua>
      <gray>-</gray> <click:suggest_command:/economy take ><hover:show_text:'<aqua>Click</aqua>'><gold>/economy take <player> <amount></gold></hover></click> <gray>-</gray> <dark_aqua>Take the specified amount of money from the specified player's balance</dark_aqua>
      <gray>-</gray> <click:suggest_command:/economy reset ><hover:show_text:'<aqua>Click</aqua>'><gold>/economy reset <player></gold></hover></click> <gray>-</gray> <dark_aqua>Reset the specified player's balance to default</dark_aqua>
      <gray>-</gray> <click:suggest_command:/economy reload><hover:show_text:'<aqua>Click</aqua>'><gold>/economy reload</gold></hover></click> <gray>-</gray> <dark_aqua>Reload the plugin</dark_aqua>

  # Messages related to the "/balance" command
  balance:

    # When a player checks their own balance
    #      - <balance> will be replaced with the player's balance
    your-balance: "<dark_aqua>You have <gold><balance></gold>.</dark_aqua>"

    # When a player checks another player's balance
    #      - <target> will be replaced with the name of the target player
    #      - <balance> will be replaced with the target's balance
    their-balance: "<dark_aqua><gold><target></gold> has <gold><balance></gold>.</dark_aqua>"

  # Messages related to the "/balancetop" command
  balancetop:

    # When a "/balancetop" is initially used
    fetching: "<dark_aqua>Fetching balances, please wait...</dark_aqua>"

    # If there are no entries
    no-entries: "<red>There are no balances to show.</red>"

    # If a player already has a "/balancetop" request in progress
    request-in-progress: "<red>You already have a request in progress, please wait for it to finish before using the command again.</red>"

    # If there are too many simultaneous "/balancetop" requests in progress
    too-many-simultaneous-requests-in-progress: "<red>There are too many requests currently in progress from other players. Please try again later.</red>"

  # Messages related to the "/pay" command
  pay:

    # What the command sender receives upon paying a player
    #      - <target> will be replaced with the name of the target player
    #      - <amount> will be replaced with the amount paid
    #      - <balance> will be replaced with the sender's resulting balance
    paid-sender: "<dark_aqua>Successfully paid <gold><amount></gold> to <gold><target></gold>. You now have <gold><balance></gold>.</dark_aqua>"

    # What the target receives upon being paid by a player
    #       - <player> will be replaced with the command sender's username
    #       - <amount> will be replaced with the amount paid
    #       - <balance> will be replaced with the target's resulting balance
    paid-target: "<dark_aqua>You have been paid <gold><amount></gold> by <gold><player></gold>. You now have <gold><balance></gold>.</dark_aqua>"

    # When a player tries to pay themselves
    cannot-pay-self: "<red>You cannot pay yourself.</red>"

    # When a player tries to pay another player who is not accepting payments
    #      - <target> will be replaced with the name of the target player
    not-accepting-payments: "<red><gold><target></gold> is not accepting payments from other players.</red>"

    # When a player tries to pay another player, but it would result in their own balance being less than 0
    #      - <amount> will be replaced with the specified amount
    insufficient-funds: "<red>You do not have enough money to afford losing <gold><amount></gold>.</red>"

  # Messages related to the "/paytoggle" command
  paytoggle:

    # When a player starts accepting payments from other players
    enabled: "<dark_aqua>You are now accepting payments from other players.</dark_aqua>"

    # When a player stops accepting payments from other players
    disabled: "<dark_aqua>You are no longer accepting payments from other players.</dark_aqua>"

  # Generic error messages
  error:

    # When an internal error occurs, such as an SQL exception preventing a payment with `/pay` from processing
    internal: "<red>An internal error occurred. Please contact server staff.</red>"

    # When a player tries to do something they don't have permission to do
    no-permission: "<red>You do not have permission to do that.</red>"

    # When a command is used incorrectly
    #      - <command> will be replaced with the root command that the player used
    #      - <argument_usage> will be replaced with correct usage of the command's arguments
    incorrect-usage: "<red>Usage:</red> <gold><command> <argument_usage></gold>"

    # When the console tries to use a command in a way that it can't (e.g. tries to check its own balance with "/balance")
    console-cannot-use: "<red>Only players can do that.</red>"

    # When a player-targeting command is run, but the target has not joined before, and they need to have in order for the command to work
    #      - <name> will be replaced with the specified name
    not-joined-before: "<red><gold><name></gold> has not joined before.</red>"

    # When a command requires the sender to have an account, but they somehow do not
    sender-account-not-found: "<red>Your economy account could not be found. This is an error; please contact server staff.</red>"

    # When a player-targeting command requires the target player to have an account, but they do not
    #      - <target> will be replaced with the name of the target player
    target-account-not-found: "<red><gold><target></gold>'s economy account could not be found.</red>"

    # When an amount is specified that must not be negative, but is
    negative-amount: "<red>Amount must not be negative.</red>"

    # When an amount is specified that must be greater than zero, but isn't
    zero-or-less-amount: "<red>Amount must be greater than zero.</red>"

    # When an amount specified is accurate to more decimal places than what the currency is configured to use
    #      - <decimal_places> will be replaced with the number of decimal places that the currency is configured to use
    too-many-decimal-places-amount: "<red>Amount uses to too many decimal places. The maximum is <gold><decimal_places></gold> decimal place(s).</red>"

    # When an amount of money is attempted to be given to a player, but it would result in the target player's balance exceeding the configured maximum balance
    #      - <target> will be replaced with the name of the target player
    #      - <max_balance> will be replaced with the configured maximum balance
    would-exceed-max-balance: "<red>This would result in <gold><target></gold>'s balance exceeding the maximum (<gold><max_balance></gold>).</red>"